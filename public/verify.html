<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SemesterSage - Verify Email</title>
<link rel="stylesheet" href="css/style.css?v=2">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1428">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1 class="app-title" style="text-align:center; font-size:24px; margin:0;">Verify your email</h1>
        <p class="text-secondary" style="text-align:center; margin:10px 0 0; font-size:14px;">
            Enter the 6-digit code sent to your university email.
        </p>

        <label class="field-label">Verification Code</label>
        <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="000000" style="text-align:center; letter-spacing:6px; font-size:20px;">

        <p class="error-text" id="errorText"></p>
        <p class="success-text" id="successText"></p>

        <button class="btn btn-primary" id="verifyBtn" onclick="handleVerify()">Verify</button>
        <a class="auth-link" href="login.html">Back to login</a>
    </div>
</div>

<script src="js/api.js?v=2"></script>
<script>
const username = sessionStorage.getItem('pendingUsername');
if (!username) window.location.href = 'register.html';

async function handleVerify() {
    const code = document.getElementById('code').value.trim();
    const errorEl = document.getElementById('errorText');
    const successEl = document.getElementById('successText');
    errorEl.classList.remove('show');
    successEl.classList.remove('show');

    if (!code) { errorEl.textContent = 'Please enter the code.'; errorEl.classList.add('show'); return; }

    const btn = document.getElementById('verifyBtn');
    btn.disabled = true;
    btn.textContent = 'Verifying...';

    try {
        await api('/auth/verify', { method: 'POST', body: JSON.stringify({ username, code }) });
        successEl.textContent = 'Verified! Redirecting to login...';
        successEl.classList.add('show');
        sessionStorage.removeItem('pendingUsername');
        setTimeout(() => window.location.href = 'login.html', 1200);
    } catch (err) {
        errorEl.textContent = err.data && err.data.error ? err.data.error : err.message;
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Verify';
    }
}
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
