<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SemesterSage - Forgot Password</title>
<link rel="stylesheet" href="css/style.css?v=9">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1428">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1 class="app-title" style="text-align:center; font-size:24px; margin:0;">Forgot Password</h1>
        <p class="text-secondary" style="text-align:center; margin:10px 0 0; font-size:14px;">
            Enter your username and we'll email you a reset code.
        </p>

        <label class="field-label">Username</label>
        <input id="username" type="text" placeholder="Enter your username">

        <p class="error-text" id="errorText"></p>
        <p class="success-text" id="successText"></p>

        <button class="btn btn-primary" id="submitBtn" onclick="handleForgotPassword()">Send Reset Code</button>
        <a class="auth-link" href="login.html">Back to login</a>
    </div>
</div>

<script src="js/api.js?v=6"></script>
<script>
async function handleForgotPassword() {
    const username = document.getElementById('username').value.trim();
    const errorEl = document.getElementById('errorText');
    const successEl = document.getElementById('successText');
    errorEl.classList.remove('show');
    successEl.classList.remove('show');

    if (!username) {
        errorEl.textContent = 'Please enter your username.';
        errorEl.classList.add('show');
        return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
        await api('/auth/forgot-password', { method: 'POST', body: JSON.stringify({ username }) });
        sessionStorage.setItem('resetUsername', username);
        successEl.textContent = 'Code sent! Redirecting...';
        successEl.classList.add('show');
        setTimeout(() => window.location.href = 'reset-password.html', 1000);
    } catch (err) {
        errorEl.textContent = err.data && err.data.error ? err.data.error : err.message;
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Send Reset Code';
    }
}
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
