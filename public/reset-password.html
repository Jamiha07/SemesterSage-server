<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SemesterSage - Reset Password</title>
<link rel="stylesheet" href="css/style.css?v=9">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1428">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1 class="app-title" style="text-align:center; font-size:24px; margin:0;">Reset Password</h1>
        <p class="text-secondary" style="text-align:center; margin:10px 0 0; font-size:14px;">
            Enter the code from your email and choose a new password.
        </p>

        <label class="field-label">Reset Code</label>
        <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="000000" style="text-align:center; letter-spacing:6px; font-size:20px;">

        <label class="field-label">New Password</label>
        <div class="password-field">
            <input id="newPassword" type="password" placeholder="Enter a new password">
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('newPassword', this)">&#128065;</button>
        </div>

        <p class="error-text" id="errorText"></p>
        <p class="success-text" id="successText"></p>

        <button class="btn btn-primary" id="submitBtn" onclick="handleResetPassword()">Reset Password</button>
        <a class="auth-link" href="forgot-password.html">Didn't get a code? Request another</a>
    </div>
</div>

<script src="js/api.js?v=6"></script>
<script>
const username = sessionStorage.getItem('resetUsername');
if (!username) window.location.href = 'forgot-password.html';

async function handleResetPassword() {
    const code = document.getElementById('code').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const errorEl = document.getElementById('errorText');
    const successEl = document.getElementById('successText');
    errorEl.classList.remove('show');
    successEl.classList.remove('show');

    if (!code || !newPassword) {
        errorEl.textContent = 'Please enter the code and a new password.';
        errorEl.classList.add('show');
        return;
    }
    if (newPassword.length < 6) {
        errorEl.textContent = 'Password must be at least 6 characters long.';
        errorEl.classList.add('show');
        return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {
        await api('/auth/reset-password', { method: 'POST', body: JSON.stringify({ username, code, newPassword }) });
        sessionStorage.removeItem('resetUsername');
        successEl.textContent = 'Password reset! Redirecting to login...';
        successEl.classList.add('show');
        setTimeout(() => window.location.href = 'login.html', 1200);
    } catch (err) {
        errorEl.textContent = err.data && err.data.error ? err.data.error : err.message;
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
    }
}
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
