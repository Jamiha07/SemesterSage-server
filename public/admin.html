<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SemesterSage - Admin</title>
<link rel="stylesheet" href="css/style.css?v=8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1428">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tab-btn { background: var(--card); border: none; color: var(--text-primary); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit; }
.tab-btn.active { background: var(--cyan); color: var(--bg); }
.row-item { display: flex; align-items: center; gap: 12px; }
.row-item .info { flex: 1; }
.row-item .sub { font-size: 11px; color: var(--text-secondary); }
</style>
</head>
<body>
<div id="shell"></div>
<div class="main-content">
    <div class="page-header"><h1>Admin Panel</h1></div>

    <div class="tabs">
        <button class="tab-btn active" id="coursesTabBtn" onclick="switchTab('courses')">Courses</button>
        <button class="tab-btn" id="usersTabBtn" onclick="switchTab('users')">Users</button>
    </div>

    <div id="coursesTab">
        <input id="courseSearch" type="text" placeholder="Search courses..." style="margin-bottom:14px;">
        <button class="btn btn-primary" style="margin:0 0 16px;" onclick="openAddCourseModal()">+ Add Course</button>
        <div id="coursesList"><p class="empty-state">Loading...</p></div>
    </div>

    <div id="usersTab" style="display:none;">
        <div id="usersList"><p class="empty-state">Loading...</p></div>
    </div>
</div>

<div class="modal-overlay" id="editCourseModal">
    <div class="modal-box">
        <h3 style="margin-top:0;">Edit Course</h3>
        <input id="editName" type="text" placeholder="Course name">
        <input id="editCode" type="text" placeholder="Course code" style="margin-top:10px;">
        <div style="display:flex; gap:10px; margin-top:18px;">
            <button class="btn btn-ghost" style="flex:1;" onclick="closeEditCourseModal()">Cancel</button>
            <button class="btn btn-primary" style="flex:1; margin-top:0;" onclick="saveEditedCourse()">Save</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="addCourseModal">
    <div class="modal-box">
        <h3 style="margin-top:0;">Add New Course</h3>
        <input id="addName" type="text" placeholder="Course name">
        <input id="addCode" type="text" placeholder="Course code (e.g. CS-250)" style="margin-top:10px;">
        <select id="addProgram" style="margin-top:10px;">
            <option value="bce">bce</option><option value="bese">bese</option>
            <option value="bscs">bscs</option><option value="bsds">bsds</option><option value="bsai">bsai</option>
        </select>
        <select id="addSemester" style="margin-top:10px;">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
            <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
        </select>
        <p class="error-text" id="addCourseError"></p>
        <div style="display:flex; gap:10px; margin-top:18px;">
            <button class="btn btn-ghost" style="flex:1;" onclick="closeAddCourseModal()">Cancel</button>
            <button class="btn btn-primary" style="flex:1; margin-top:0;" onclick="submitAddCourse()">Add</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="deleteUserModal">
    <div class="modal-box danger">
        <p id="deleteUserText" style="font-weight:bold; text-align:center;"></p>
        <div style="display:flex; gap:10px; margin-top:18px;">
            <button class="btn btn-ghost" style="flex:1;" onclick="closeDeleteUserModal()">Cancel</button>
            <button class="btn btn-danger" style="flex:1;" onclick="confirmDeleteUser()">Delete</button>
        </div>
    </div>
</div>

<script src="js/api.js?v=5"></script>
<script src="js/app.js?v=7"></script>
<script>
let allCourses = [];
let editingCourseId = null;
let pendingDeleteUsername = null;

async function init() {
    await renderShell('admin');
    if (!getUser().isAdmin) { window.location.href = 'feed.html'; return; }

    document.getElementById('courseSearch').addEventListener('input', renderCourses);
    await loadCourses();
    await loadUsers();
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function switchTab(tab) {
    document.getElementById('coursesTab').style.display = tab === 'courses' ? 'block' : 'none';
    document.getElementById('usersTab').style.display = tab === 'users' ? 'block' : 'none';
    document.getElementById('coursesTabBtn').classList.toggle('active', tab === 'courses');
    document.getElementById('usersTabBtn').classList.toggle('active', tab === 'users');
}

async function loadCourses() {
    try {
        allCourses = await api('/courses/admin/all');
        renderCourses();
    } catch (err) {
        document.getElementById('coursesList').innerHTML = `<p class="empty-state">${err.message}</p>`;
    }
}

function renderCourses() {
    const filter = document.getElementById('courseSearch').value.trim().toLowerCase();
    const filtered = filter
        ? allCourses.filter(c => c.name.toLowerCase().includes(filter) || (c.code || '').toLowerCase().includes(filter))
        : allCourses;

    const container = document.getElementById('coursesList');
    if (filtered.length === 0) { container.innerHTML = '<p class="empty-state">No courses match.</p>'; return; }

    container.innerHTML = filtered.map(c => `
        <div class="card row-item">
            <div class="info">
                <div style="font-weight:bold;">${escapeHtml(c.code || '\u2014')} &mdash; ${escapeHtml(c.name)}</div>
                <div class="sub">${escapeHtml(c.programLinks)}</div>
            </div>
            <button class="btn btn-ghost" style="padding:8px 14px; font-size:12px;" onclick="openEditCourseModal(${c.id}, '${escapeHtml(c.name).replace(/'/g,"\\'")}', '${escapeHtml(c.code || '').replace(/'/g,"\\'")}')">Edit</button>
        </div>
    `).join('');
}

function openEditCourseModal(id, name, code) {
    editingCourseId = id;
    document.getElementById('editName').value = name;
    document.getElementById('editCode').value = code;
    document.getElementById('editCourseModal').classList.add('show');
}
function closeEditCourseModal() { document.getElementById('editCourseModal').classList.remove('show'); }

async function saveEditedCourse() {
    const name = document.getElementById('editName').value.trim();
    const code = document.getElementById('editCode').value.trim();
    try {
        await api(`/courses/admin/${editingCourseId}`, { method: 'PUT', body: JSON.stringify({ name, code }) });
        closeEditCourseModal();
        loadCourses();
    } catch (err) {
        alert(err.message);
    }
}

function openAddCourseModal() { document.getElementById('addCourseModal').classList.add('show'); }
function closeAddCourseModal() {
    document.getElementById('addCourseModal').classList.remove('show');
    document.getElementById('addName').value = '';
    document.getElementById('addCode').value = '';
    document.getElementById('addCourseError').classList.remove('show');
}

async function submitAddCourse() {
    const name = document.getElementById('addName').value.trim();
    const code = document.getElementById('addCode').value.trim();
    const program = document.getElementById('addProgram').value;
    const semester = parseInt(document.getElementById('addSemester').value, 10);
    const errEl = document.getElementById('addCourseError');

    if (!name || !code) { errEl.textContent = 'Please fill out every field.'; errEl.classList.add('show'); return; }

    try {
        await api('/courses/admin', { method: 'POST', body: JSON.stringify({ name, code, program, semester }) });
        closeAddCourseModal();
        loadCourses();
    } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add('show');
    }
}

async function loadUsers() {
    const container = document.getElementById('usersList');
    try {
        const users = await api('/users/admin/all');
        container.innerHTML = users.map(u => `
            <div class="card row-item">
                <div class="info">
                    <div style="font-weight:bold;">@${escapeHtml(u.username)} ${u.is_admin ? '\u{1F451}' : ''}</div>
                    <div class="sub">${escapeHtml(u.email)} &bull; ${escapeHtml(u.program || 'no program')} &bull; Sem ${u.semester}</div>
                </div>
                <button class="btn btn-danger" style="padding:8px 14px; font-size:12px;" onclick="openDeleteUserModal('${escapeHtml(u.username).replace(/'/g,"\\'")}')">Delete</button>
            </div>
        `).join('');
    } catch (err) {
        container.innerHTML = `<p class="empty-state">${err.message}</p>`;
    }
}

function openDeleteUserModal(username) {
    pendingDeleteUsername = username;
    document.getElementById('deleteUserText').textContent = `Permanently delete @${username}'s account?`;
    document.getElementById('deleteUserModal').classList.add('show');
}
function closeDeleteUserModal() { document.getElementById('deleteUserModal').classList.remove('show'); }

async function confirmDeleteUser() {
    try {
        await api(`/users/admin/${pendingDeleteUsername}`, { method: 'DELETE' });
        closeDeleteUserModal();
        loadUsers();
    } catch (err) {
        alert(err.message);
    }
}

init();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
